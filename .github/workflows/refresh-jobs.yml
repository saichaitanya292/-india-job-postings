name: Refresh job feed
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect configured public job boards
        run: python scripts/refresh_jobs.py
      - name: Commit changed feed
        run: |
          if ! git diff --quiet -- data/jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json
            git commit -m "Refresh job feed"
            git push
          else
            echo "No job feed changes."
          fi
